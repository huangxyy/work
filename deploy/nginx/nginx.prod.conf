worker_processes  auto;
worker_rlimit_nofile 65535;

events {
  worker_connections  4096;
  multi_accept on;
  use epoll;
}

http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  tcp_nopush    on;
  tcp_nodelay   on;
  keepalive_timeout  65;
  keepalive_requests 1000;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  gzip  on;
  gzip_vary on;
  gzip_min_length 256;
  gzip_comp_level 6;
  gzip_proxied any;
  gzip_types
    text/plain
    text/css
    application/json
    text/csv
    application/pdf
    application/javascript
    application/xml
    text/javascript
    image/svg+xml
    application/wasm;

  gzip_static on;

  server_tokens off;

  proxy_cache_path /var/cache/nginx/api levels=1:2 keys_zone=api_cache:10m max_size=100m inactive=5m;

  upstream backend {
    server api:3000;
    keepalive 32;
  }

  server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 120m;

    # Static assets with long-term caching (Vite hashed filenames)
    location /assets/ {
      expires 1y;
      add_header Cache-Control "public, immutable";
      add_header X-Content-Type-Options "nosniff" always;
    }

    # Service worker - never cache
    location = /sw.js {
      expires -1;
      add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Manifest - short cache
    location = /manifest.json {
      expires 1h;
      add_header Cache-Control "public";
    }

    # Favicon and icons - medium cache
    location ~* \.(ico|svg|png)$ {
      expires 7d;
      add_header Cache-Control "public";
    }

    # API proxy
    location /api/ {
      proxy_pass http://backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Connection "";
      proxy_read_timeout 300s;
      proxy_send_timeout 300s;
      proxy_buffering on;
      proxy_buffer_size 16k;
      proxy_buffers 8 16k;
    }

    # Swagger docs
    location /api/docs {
      proxy_pass http://backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
    }

    # SPA fallback - serve index.html for all non-file routes
    location / {
      try_files $uri $uri/ /index.html;

      # index.html should never be cached
      location = /index.html {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
      }
    }
  }
}
