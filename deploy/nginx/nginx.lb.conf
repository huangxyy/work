# =============================================================================
# Nginx Load Balancer Configuration
# Use this when running multiple API instances behind a single Nginx
# 
# Usage:
#   1. Copy to /etc/nginx/nginx.conf (or include in sites-enabled)
#   2. Update upstream backend servers with actual IPs
#   3. Update server_name with your domain
#   4. nginx -t && systemctl reload nginx
# =============================================================================

worker_processes  auto;
worker_rlimit_nofile 65535;

events {
  worker_connections  4096;
  multi_accept on;
}

http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  tcp_nopush    on;
  tcp_nodelay   on;
  keepalive_timeout  65;

  gzip  on;
  gzip_vary on;
  gzip_min_length 256;
  gzip_comp_level 6;
  gzip_proxied any;
  gzip_static on;
  gzip_types text/plain text/css application/json application/javascript text/javascript image/svg+xml application/wasm;

  server_tokens off;

  # --- Load-balanced API backend ---
  # Add/remove servers as needed. health_check requires nginx-plus or use passive checks.
  upstream api_backend {
    least_conn;

    # Server 1
    server 192.168.1.101:3000 max_fails=3 fail_timeout=30s;
    # Server 2
    server 192.168.1.102:3000 max_fails=3 fail_timeout=30s;
    # Server 3 (backup - only used when others are down)
    # server 192.168.1.103:3000 backup;

    keepalive 32;
  }

  # Rate limiting zones
  limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
  limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;

  server {
    listen 80;
    server_name your-domain.com;

    # Redirect to HTTPS (uncomment when SSL is configured)
    # return 301 https://$host$request_uri;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 120m;

    # Static assets - immutable cache
    location /assets/ {
      expires 1y;
      add_header Cache-Control "public, immutable";
    }

    # Service worker - no cache
    location = /sw.js {
      expires -1;
      add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Auth endpoints - stricter rate limiting
    location /api/auth/ {
      limit_req zone=auth_limit burst=10 nodelay;
      proxy_pass http://api_backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Connection "";
    }

    # API - load balanced
    location /api/ {
      limit_req zone=api_limit burst=60 nodelay;
      proxy_pass http://api_backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Connection "";
      proxy_read_timeout 300s;
      proxy_send_timeout 300s;
      proxy_next_upstream error timeout http_502 http_503;
      proxy_next_upstream_tries 2;
    }

    # SPA fallback
    location / {
      try_files $uri $uri/ /index.html;

      location = /index.html {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
      }
    }
  }

  # --- HTTPS server (uncomment and configure with your SSL cert) ---
  # server {
  #   listen 443 ssl http2;
  #   server_name your-domain.com;
  #
  #   ssl_certificate     /etc/ssl/certs/your-domain.com.pem;
  #   ssl_certificate_key /etc/ssl/private/your-domain.com.key;
  #   ssl_protocols       TLSv1.2 TLSv1.3;
  #   ssl_ciphers         HIGH:!aNULL:!MD5;
  #   ssl_prefer_server_ciphers on;
  #   ssl_session_cache   shared:SSL:10m;
  #   ssl_session_timeout 10m;
  #
  #   # ... same location blocks as above ...
  # }
}
