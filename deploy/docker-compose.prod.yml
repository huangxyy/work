# =============================================================================
# Production Docker Compose - Full Homework AI Stack
# Usage:
#   1. cp deploy/.env.prod.example deploy/.env.prod
#   2. Edit deploy/.env.prod with your settings
#   3. docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env.prod up -d
# =============================================================================

services:
  # --- Database ---
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-homework_ai}
      MYSQL_USER: ${DB_USER:-homework_ai}
      MYSQL_PASSWORD: ${DB_PASS:?DB_PASS is required}
    volumes:
      - mysql-data:/var/lib/mysql
    deploy:
      resources:
        limits:
          memory: 1G
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    networks:
      - internal

  # --- Cache / Queue ---
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --appendonly yes
    volumes:
      - redis-data:/data
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    networks:
      - internal

  # --- Object Storage ---
  minio:
    image: minio/minio:RELEASE.2023-12-23T07-19-11Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    volumes:
      - minio-data:/data
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    networks:
      - internal

  # --- Backend API ---
  api:
    build:
      context: ..
      dockerfile: Dockerfile
      target: backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: "mysql://${DB_USER:-homework_ai}:${DB_PASS}@mysql:3306/${DB_NAME:-homework_ai}"
      REDIS_URL: "redis://redis:6379"
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      MINIO_ENDPOINT: "http://minio:9000"
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-submissions}
      BAIDU_OCR_API_KEY: ${BAIDU_OCR_API_KEY:-}
      BAIDU_OCR_SECRET_KEY: ${BAIDU_OCR_SECRET_KEY:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@homework-ai.local}
    deploy:
      resources:
        limits:
          memory: 512M
      replicas: ${API_REPLICAS:-1}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - internal

  # --- Background Worker ---
  worker:
    build:
      context: ..
      dockerfile: Dockerfile
      target: backend
    command: ["node", "dist/worker/main.js"]
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: "mysql://${DB_USER:-homework_ai}:${DB_PASS}@mysql:3306/${DB_NAME:-homework_ai}"
      REDIS_URL: "redis://redis:6379"
      MINIO_ENDPOINT: "http://minio:9000"
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-submissions}
      BAIDU_OCR_API_KEY: ${BAIDU_OCR_API_KEY:-}
      BAIDU_OCR_SECRET_KEY: ${BAIDU_OCR_SECRET_KEY:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-5}
    deploy:
      resources:
        limits:
          memory: 1G
      replicas: ${WORKER_REPLICAS:-1}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - internal

  # --- Frontend (Nginx) ---
  web:
    build:
      context: ..
      dockerfile: Dockerfile
      target: frontend
      args:
        VITE_API_BASE_URL: /api
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"
    deploy:
      resources:
        limits:
          memory: 128M
    depends_on:
      - api
    logging:
      driver: json-file
      options:
        max-size: "30m"
        max-file: "3"
    networks:
      - internal

  # --- DB Migration (run once) ---
  migrate:
    build:
      context: ..
      dockerfile: Dockerfile
      target: backend
    command: ["npx", "prisma", "migrate", "deploy", "--schema", "prisma/schema.prisma"]
    environment:
      DATABASE_URL: "mysql://${DB_USER:-homework_ai}:${DB_PASS}@mysql:3306/${DB_NAME:-homework_ai}"
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"
    networks:
      - internal

volumes:
  mysql-data:
  redis-data:
  minio-data:

networks:
  internal:
    driver: bridge
