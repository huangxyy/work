global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'mysql'
    static_configs:
      - targets: ['mysqld-exporter:9104']

  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']

  - job_name: 'homework-ai-api'
    metrics_path: /api/health
    scrape_interval: 30s
    static_configs:
      - targets: ['api:3000']
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: '.*'
        action: keep
