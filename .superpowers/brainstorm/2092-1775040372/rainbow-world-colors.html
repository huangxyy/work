<h2>🌈 彩虹世界 - 配色方案</h2>
<p class="subtitle">为不同页面赋予不同主题色，打造多彩学习体验</p>

<div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; margin: 24px 0;">
  <div style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); padding: 20px; border-radius: 16px; color: white;">
    <div style="font-size: 32px; margin-bottom: 8px;">📚</div>
    <div style="font-size: 18px; font-weight: bold;">作业列表页</div>
    <div style="font-size: 12px; opacity: 0.9; margin-top: 4px;">主色调 #667eea → #764ba2</div>
  </div>

  <div style="background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); padding: 20px; border-radius: 16px; color: white;">
    <div style="font-size: 32px; margin-bottom: 8px;">📝</div>
    <div style="font-size: 18px; font-weight: bold;">提交作业页</div>
    <div style="font-size: 12px; opacity: 0.9; margin-top: 4px;">主色调 #f093fb → #f5576c</div>
  </div>

  <div style="background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); padding: 20px; border-radius: 16px; color: white;">
    <div style="font-size: 32px; margin-bottom: 8px;">✨</div>
    <div style="font-size: 18px; font-weight: bold;">批改结果页</div>
    <div style="font-size: 12px; opacity: 0.9; margin-top: 4px;">主色调 #4facfe → #00f2fe</div>
  </div>

  <div style="background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%); padding: 20px; border-radius: 16px; color: white;">
    <div style="font-size: 32px; margin-bottom: 8px;">👤</div>
    <div style="font-size: 18px; font-weight: bold;">个人中心页</div>
    <div style="font-size: 12px; opacity: 0.9; margin-top: 4px;">主色调 #43e97b → #38f9d7</div>
  </div>

  <div style="background: linear-gradient(135deg, #fa709a 0%, #fee140 100%); padding: 20px; border-radius: 16px; color: white;">
    <div style="font-size: 32px; margin-bottom: 8px;">🔔</div>
    <div style="font-size: 18px; font-weight: bold;">消息通知页</div>
    <div style="font-size: 12px; opacity: 0.9; margin-top: 4px;">主色调 #fa709a → #fee140</div>
  </div>

  <div style="background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%); padding: 20px; border-radius: 16px; color: #333;">
    <div style="font-size: 32px; margin-bottom: 8px;">📊</div>
    <div style="font-size: 18px; font-weight: bold;">学习报告页</div>
    <div style="font-size: 12px; opacity: 0.8; margin-top: 4px;">主色调 #a8edea → #fed6e3</div>
  </div>
</div>

<h3 style="margin-top: 32px;">通用配色规范</h3>
<div style="display: flex; gap: 12px; flex-wrap: wrap; margin-top: 16px;">
  <div style="background: #333; color: white; padding: 8px 16px; border-radius: 100px; font-size: 12px;">文字 #333333</div>
  <div style="background: #666; color: white; padding: 8px 16px; border-radius: 100px; font-size: 12px;">次要文字 #666666</div>
  <div style="background: #999; color: white; padding: 8px 16px; border-radius: 100px; font-size: 12px;">提示文字 #999999</div>
  <div style="background: #f5f5f5; color: #333; padding: 8px 16px; border-radius: 100px; font-size: 12px; border: 1px solid #ddd;">背景 #f5f5f5</div>
  <div style="background: #fff; color: #333; padding: 8px 16px; border-radius: 100px; font-size: 12px; border: 1px solid #ddd;">卡片 #ffffff</div>
</div>
